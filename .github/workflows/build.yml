name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - app
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - app
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Verify (check + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            file \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            liblcms2-dev \
            libjpeg-dev

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Type check (Svelte)
        run: bun run check

      - name: Frontend tests (Vitest)
        run: bun run test:frontend

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        env:
          RUSTUP_HOME: ${{ runner.temp }}/rustup
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # The shared sync core. --no-default-features is how the phone apps
      # build it (no mdns-sd), so that configuration must keep compiling.
      # Shares the desktop's target dir so dependencies build once.
      - name: Sync core tests
        env:
          CARGO_TARGET_DIR: src-tauri/target
        run: |
          cargo test --manifest-path crates/quakboard-sync/Cargo.toml
          cargo test --manifest-path crates/quakboard-sync/Cargo.toml --no-default-features

      - name: Sync core lint
        env:
          CARGO_TARGET_DIR: src-tauri/target
        run: |
          cargo clippy --manifest-path crates/quakboard-sync/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path crates/quakboard-sync/Cargo.toml --all-targets --no-default-features -- -D warnings

      # The layer the phone apps call (UniFFI). Runs from its own folder:
      # uniffi-bindgen reads `cargo metadata` from the current directory.
      - name: Sync FFI tests and lint
        working-directory: crates/quakboard-sync-ffi
        env:
          CARGO_TARGET_DIR: ../../src-tauri/target
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings

      # Proves the exported API still converts to Swift and Kotlin. The
      # generated files aren't kept; the iOS build makes its own (Phase 3).
      - name: Generate phone bindings
        working-directory: crates/quakboard-sync-ffi
        env:
          CARGO_TARGET_DIR: ../../src-tauri/target
        run: |
          cargo build
          for language in swift kotlin; do
            cargo run --features bindgen --bin uniffi-bindgen -- generate \
              --library ../../src-tauri/target/debug/libquakboard_sync_ffi.so \
              --language "$language" --out-dir "$RUNNER_TEMP/bindings/$language"
          done

  build-frontend:
    name: Build frontend bundle
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-frontend.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute frontend hash
        id: frontend-hash
        run: |
          HASH=$(git ls-files \
            'src/**' \
            'package.json' \
            'bun.lock' \
            'svelte.config.js' \
            'vite.config.js' \
            'tsconfig.json' | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Restore cached build
        id: cache-frontend
        uses: actions/cache@v6
        with:
          path: build
          key: svelte-build-${{ steps.frontend-hash.outputs.hash }}
          restore-keys: |
            svelte-build-

      - name: Set up Bun
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Build frontend
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        run: bun run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: build
          retention-days: 3

  build-tauri:
    name: Build desktop (${{ matrix.name }})
    needs: [tests, build-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-intel
            os: macos-15
            target: x86_64-apple-darwin
          - name: macos-apple-silicon
            os: macos-15
            target: aarch64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Download frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: build

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        env:
          RUSTUP_HOME: ${{ runner.temp }}/rustup
        with:
          targets: ${{ matrix.target }}

      # Instalar dependencias de Linux
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            liblcms2-dev \
            libjpeg-dev \
            pkg-config \
            build-essential \
            xdg-utils

      # Agregar target de Rust para Windows ARM64
      - name: Add Rust target for Windows ARM64
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: rustup target add aarch64-pc-windows-msvc

      # Agregar target x86_64 en macOS ARM64 runner para cross-compilation
      - name: Add Rust target for macOS Intel (cross-compile)
        if: matrix.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Cache cargo builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        env:
          TAURI_SKIP_BUILD_FRONTEND: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --target ${{ matrix.target }}

      # linuxdeploy-plugin-gtk bundles WebKitGTK together with the build host's
      # GL/EGL/Wayland/Mesa stack. Those libs can't initialize EGL against a
      # newer host driver (Mesa/amdgpu), so the window never appears
      # ("Could not create default EGL display: EGL_BAD_PARAMETER"). It also
      # forces GDK_BACKEND=x11 in the AppRun hook. We repack the AppImage to
      # drop both: the bundled graphics stack (so the host's is used) and the
      # X11 forcing (so Wayland runs natively; the DMABUF renderer is disabled
      # in-app instead). .deb/.rpm/AUR are unaffected — they use system WebKit.
      - name: Harden AppImage (use host GL/EGL/Wayland stack)
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail

          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/appimage"
          APPIMAGE=$(find "$BUNDLE_DIR" -maxdepth 1 -name '*.AppImage' 2>/dev/null | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "::warning::No AppImage found in $BUNDLE_DIR; skipping hardening"
            exit 0
          fi
          echo "Hardening: $APPIMAGE"

          case "${{ matrix.target }}" in
            x86_64-*)  TOOL_ARCH=x86_64 ;;
            aarch64-*) TOOL_ARCH=aarch64 ;;
            *) echo "::error::Unsupported target ${{ matrix.target }}"; exit 1 ;;
          esac
          export ARCH="$TOOL_ARCH"

          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${TOOL_ARCH}.AppImage" -O appimagetool
          chmod +x appimagetool

          workdir=$(mktemp -d)
          cp "$APPIMAGE" "$workdir/app.AppImage"
          ( cd "$workdir" && ./app.AppImage --appimage-extract >/dev/null )
          APPDIR="$workdir/squashfs-root"

          # 1) Remove host-coupled graphics libraries. These must never ship in
          #    an AppImage — the app must use the user's real driver stack.
          graphics_libs=(
            'libEGL.so*' 'libGL.so*' 'libGLX.so*' 'libGLdispatch.so*'
            'libOpenGL.so*' 'libGLESv2.so*' 'libgbm.so*' 'libdrm.so*'
            'libdrm_*.so*' 'libgallium*.so*' 'libvulkan.so*' 'libvulkan_*.so*'
            'libwayland-client.so*' 'libwayland-server.so*'
            'libwayland-egl.so*' 'libwayland-cursor.so*'
          )
          for pat in "${graphics_libs[@]}"; do
            find "$APPDIR" -type f -name "$pat" -print -delete || true
          done
          # Mesa DRI/Gallium driver directories
          find "$APPDIR" -type d -name dri -exec rm -rf {} + 2>/dev/null || true

          # 2) Drop the forced GDK_BACKEND=x11 from the linuxdeploy-gtk hook.
          HOOK="$APPDIR/apprun-hooks/linuxdeploy-plugin-gtk.sh"
          if [ -f "$HOOK" ]; then
            sed -i '/GDK_BACKEND/d' "$HOOK"
          fi

          # 3) Repack in place.
          ./appimagetool "$APPDIR" "$workdir/out.AppImage"
          mv -f "$workdir/out.AppImage" "$APPIMAGE"
          chmod +x "$APPIMAGE"
          echo "Hardened AppImage written: $APPIMAGE"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tauri-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**
          retention-days: 7

  release:
    name: Release artifacts
    needs: build-tauri
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        id: prepare
        run: |
          mkdir -p release-assets
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          copy_bundle() {
            target="$1"
            src_pattern="$2"
            dest_name="$3"
            dir="artifacts/tauri-${target}"
            file=$(find "$dir" -type f -name "$src_pattern" 2>/dev/null | head -1)
            if [ -n "$file" ] && [ -f "$file" ]; then
              cp "$file" "release-assets/${dest_name}"
              echo "✅ copied $(basename "$file") -> ${dest_name}"
            else
              echo "⚠️ missing artifact ${src_pattern} in ${dir}" >&2
            fi
          }

          # También copiar los archivos .sig si existen (generados por Tauri updater)
          copy_sig() {
            target="$1"
            src_pattern="$2"
            dest_name="$3"
            dir="artifacts/tauri-${target}"
            file=$(find "$dir" -type f -name "$src_pattern" 2>/dev/null | head -1)
            if [ -n "$file" ] && [ -f "$file" ]; then
              cp "$file" "release-assets/${dest_name}"
              echo "✅ copied sig $(basename "$file") -> ${dest_name}"
            fi
          }

          # macOS
          copy_bundle "x86_64-apple-darwin" "*.dmg" "Quakboard-${VERSION}-macOS-Intel.dmg"
          copy_bundle "x86_64-apple-darwin" "*.app.tar.gz" "Quakboard-${VERSION}-macOS-Intel.app.tar.gz"
          copy_sig "x86_64-apple-darwin" "*.app.tar.gz.sig" "Quakboard-${VERSION}-macOS-Intel.app.tar.gz.sig"

          copy_bundle "aarch64-apple-darwin" "*.dmg" "Quakboard-${VERSION}-macOS-AppleSilicon.dmg"
          copy_bundle "aarch64-apple-darwin" "*.app.tar.gz" "Quakboard-${VERSION}-macOS-AppleSilicon.app.tar.gz"
          copy_sig "aarch64-apple-darwin" "*.app.tar.gz.sig" "Quakboard-${VERSION}-macOS-AppleSilicon.app.tar.gz.sig"

          # Windows
          copy_bundle "x86_64-pc-windows-msvc" "*x64_en-US.msi" "Quakboard-${VERSION}-Windows-x64.msi"
          copy_bundle "x86_64-pc-windows-msvc" "*x64-setup.exe" "Quakboard-${VERSION}-Windows-x64-Setup.exe"
          copy_sig "x86_64-pc-windows-msvc" "*x64-setup.exe.sig" "Quakboard-${VERSION}-Windows-x64-Setup.exe.sig"

          copy_bundle "aarch64-pc-windows-msvc" "*arm64_en-US.msi" "Quakboard-${VERSION}-Windows-arm64.msi"
          copy_bundle "aarch64-pc-windows-msvc" "*arm64-setup.exe" "Quakboard-${VERSION}-Windows-arm64-Setup.exe"
          copy_sig "aarch64-pc-windows-msvc" "*arm64-setup.exe.sig" "Quakboard-${VERSION}-Windows-arm64-Setup.exe.sig"

          # Linux
          copy_bundle "x86_64-unknown-linux-gnu" "*.AppImage" "Quakboard-${VERSION}-Linux-x64.AppImage"
          copy_bundle "x86_64-unknown-linux-gnu" "*.deb" "Quakboard-${VERSION}-Linux-x64.deb"
          copy_bundle "x86_64-unknown-linux-gnu" "*.rpm" "Quakboard-${VERSION}-Linux-x64.rpm"

          copy_bundle "aarch64-unknown-linux-gnu" "*.AppImage" "Quakboard-${VERSION}-Linux-arm64.AppImage"
          copy_bundle "aarch64-unknown-linux-gnu" "*arm64.deb" "Quakboard-${VERSION}-Linux-arm64.deb"
          copy_bundle "aarch64-unknown-linux-gnu" "*aarch64.rpm" "Quakboard-${VERSION}-Linux-arm64.rpm"

          (cd release-assets && sha256sum * > SHA256SUMS 2>/dev/null || true)

      - name: Generate latest.json for updater
        id: updater
        run: |
          VERSION=${{ steps.prepare.outputs.version }}
          TAG=${GITHUB_REF#refs/tags/}
          REPO=${{ github.repository }}
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Read signatures if they exist
          read_sig() {
            local file="release-assets/$1"
            if [ -f "$file" ]; then
              cat "$file"
            else
              echo ""
            fi
          }

          MACOS_INTEL_SIG=$(read_sig "Quakboard-${VERSION}-macOS-Intel.app.tar.gz.sig")
          MACOS_ARM_SIG=$(read_sig "Quakboard-${VERSION}-macOS-AppleSilicon.app.tar.gz.sig")
          WINDOWS_X64_SIG=$(read_sig "Quakboard-${VERSION}-Windows-x64-Setup.exe.sig")
          WINDOWS_ARM_SIG=$(read_sig "Quakboard-${VERSION}-Windows-arm64-Setup.exe.sig")

          # Create latest.json (Linux updater not supported - AppImage doesn't have signature)
          cat > release-assets/latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "See the release notes on GitHub for full details.",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-x86_64": {
                "signature": "${MACOS_INTEL_SIG}",
                "url": "${BASE_URL}/Quakboard-${VERSION}-macOS-Intel.app.tar.gz"
              },
              "darwin-aarch64": {
                "signature": "${MACOS_ARM_SIG}",
                "url": "${BASE_URL}/Quakboard-${VERSION}-macOS-AppleSilicon.app.tar.gz"
              },
              "windows-x86_64": {
                "signature": "${WINDOWS_X64_SIG}",
                "url": "${BASE_URL}/Quakboard-${VERSION}-Windows-x64-Setup.exe"
              },
              "windows-aarch64": {
                "signature": "${WINDOWS_ARM_SIG}",
                "url": "${BASE_URL}/Quakboard-${VERSION}-Windows-arm64-Setup.exe"
              }
            }
          }
          EOF

          echo "✅ Generated latest.json"
          cat release-assets/latest.json

      - name: Generate release notes
        id: notes
        run: |
          VERSION=${{ steps.prepare.outputs.version }}
          TAG=${GITHUB_REF#refs/tags/}
          REPO=${{ github.repository }}

          BODY="## 📦 Downloads

          | Platform | Architecture | Download |
          |----------|-------------|----------|
          | Windows | x64 | [Setup.exe](https://github.com/${REPO}/releases/download/${TAG}/Quakboard-${VERSION}-Windows-x64-Setup.exe) / [.msi](https://github.com/${REPO}/releases/download/${TAG}/Quakboard-${VERSION}-Windows-x64.msi) |
          | Windows | ARM64 | [Setup.exe](https://github.com/${REPO}/releases/download/${TAG}/Quakboard-${VERSION}-Windows-arm64-Setup.exe) / [.msi](https://github.com/${REPO}/releases/download/${TAG}/Quakboard-${VERSION}-Windows-arm64.msi) |
          | macOS | Intel | [.dmg](https://github.com/${REPO}/releases/download/${TAG}/Quakboard-${VERSION}-macOS-Intel.dmg) |
          | macOS | Apple Silicon | [.dmg](https://github.com/${REPO}/releases/download/${TAG}/Quakboard-${VERSION}-macOS-AppleSilicon.dmg) |
          | Linux | x64 | [.AppImage](https://github.com/${REPO}/releases/download/${TAG}/Quakboard-${VERSION}-Linux-x64.AppImage) / [.deb](https://github.com/${REPO}/releases/download/${TAG}/Quakboard-${VERSION}-Linux-x64.deb) / [.rpm](https://github.com/${REPO}/releases/download/${TAG}/Quakboard-${VERSION}-Linux-x64.rpm) |
          | Linux | ARM64 | [.AppImage](https://github.com/${REPO}/releases/download/${TAG}/Quakboard-${VERSION}-Linux-arm64.AppImage) / [.deb](https://github.com/${REPO}/releases/download/${TAG}/Quakboard-${VERSION}-Linux-arm64.deb) / [.rpm](https://github.com/${REPO}/releases/download/${TAG}/Quakboard-${VERSION}-Linux-arm64.rpm) |

          ## 🔄 Auto-Update

          If you already have the app installed, you can update directly from the app menu!

          ## 🍎 macOS Installation Note

          If you see a message saying the app is damaged, run this command in Terminal:

          \`\`\`bash
          sudo xattr -d com.apple.quarantine \"/Applications/Quakboard.app\"
          \`\`\`"

          {
            echo "body<<RELEASE_NOTES_DELIMITER"
            echo "$BODY"
            echo "RELEASE_NOTES_DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false

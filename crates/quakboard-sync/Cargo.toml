[package]
name = "quakboard-sync"
version = "0.1.0"
edition = "2021"
description = "Quakboard LAN sync core: wire format, pairing, encryption, transfer"
publish = false

[features]
default = ["mdns"]
# mDNS discovery for desktop. Phones use native Bonjour/NSD instead.
mdns = ["dep:mdns-sd"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25.8"
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
chacha20poly1305 = "0.11"
base64 = "0.22"
spake2 = "0.4"
getrandom = "0.3"
mdns-sd = { version = "0.21.4", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
tempfile = "3.8"

[package]
name = "quakboard"
version = "1.5.1"
description = "A Tauri App"
authors = ["Dereck Angeles"]
edition = "2021"
default-run = "quakboard"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quakboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lazy_static = "1.5"
palette = "0.7"
reqwest = { version = "0.11", features = ["blocking"] }
scraper = "0.17"
image = "0.25.8"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Clipboard accessk
arboard = "3.6.1"

# UUID generation
uuid = { version = "1.10", features = ["v4", "serde"] }

# Hashing for file deduplication
sha2 = "0.10"
pico-args = "0.5"

# Filesystem watching (opt-in capture-folder watcher) with debouncing so we
# only act once a file has finished being written.
notify-debouncer-mini = "0.4"

# Async runtime (para el monitor del clipboard)
tokio = { version = "1", features = ["full"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-autostart = "2.5.1"
percent-encoding = "2.3.2"
clipboard-master = "3.1.3"
mime_guess = "2.0.5"
widestring = "1.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
enigo = "0.6.1"
libc = "0.2.186"
chacha20poly1305 = "0.11"
base64 = "0.22"
spake2 = "0.4"
getrandom = "0.3"
mdns-sd = "0.21.4"
if-addrs = "0.15"

# Test dependencies
[dev-dependencies]
tempfile = "3.8"

# Dependencias específicas por plataforma
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-foundation-sys = "0.8"
core-graphics = "0.23"
foreign-types = "0.5"
objc2 = "0.6.3"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
"Win32_Foundation",
"Win32_Graphics_Gdi",
"Win32_System_Com",
"Win32_UI_Shell",
] }

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "0.20", features = ["png"] }
pango = "0.20"
pangocairo = "0.20"
md5 = "0.7"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Binary para captura de screenshots (se compila por separado y se descarga como feature opcional)
[[bin]]
name = "screenshot-helper"
path = "src/bin/screenshot-helper.rs"
